<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-family:system-ui,sans-serif;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Coach Comercial Latinbien</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: agenda de trabajo del dia. Barra superior fija con pestanas; debajo, filtros en una fila,
   franja de avance y la lista agrupada por urgencia, cada cliente como una fila con la ACCION en su columna. */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --surface-2:#eef1f6; --line:#d9dee7;
  --ink:#16202e; --ink-2:#4a5568; --ink-3:#7b8494;
  --accent:#1d4e89; --accent-ink:#ffffff; --accent-soft:#e3ecf7;
  --hecho:#1f7a55; --hecho-soft:#e2f2ea;
  --hoy:#a65d00; --hoy-soft:#fdf0dc;
  --urgente:#b3261e; --urgente-soft:#fbe5e3;
  --neutro-soft:#eceff4;
  --f-display:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f141b; --surface:#161d27; --surface-2:#1c2531; --line:#2a3443;
  --ink:#e6ebf2; --ink-2:#aeb8c6; --ink-3:#7f8a9a;
  --accent:#7fb0ec; --accent-ink:#0d1622; --accent-soft:#1d2c40;
  --hecho:#5cc796; --hecho-soft:#173326;
  --hoy:#f0b45c; --hoy-soft:#3a2a12;
  --urgente:#f08a82; --urgente-soft:#3d1c1a;
  --neutro-soft:#212b38; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0f141b; --surface:#161d27; --surface-2:#1c2531; --line:#2a3443;
  --ink:#e6ebf2; --ink-2:#aeb8c6; --ink-3:#7f8a9a;
  --accent:#7fb0ec; --accent-ink:#0d1622; --accent-soft:#1d2c40;
  --hecho:#5cc796; --hecho-soft:#173326;
  --hoy:#f0b45c; --hoy-soft:#3a2a12;
  --urgente:#f08a82; --urgente-soft:#3d1c1a;
  --neutro-soft:#212b38; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
a{color:var(--accent)}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.barra{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.barra-in{max-width:1180px;margin:0 auto;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-block:12px 0}
.marca h1{font-family:var(--f-display);font-weight:700;font-size:24px;letter-spacing:.2px;margin:0;line-height:1.1;text-wrap:balance}
.marca p{margin:2px 0 10px;color:var(--ink-3);font-size:13px}
.tabs{display:flex;gap:2px}
.tab{background:none;border:none;border-bottom:3px solid transparent;padding:10px 14px;cursor:pointer;color:var(--ink-2);font-weight:600}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}

main{max-width:1180px;margin:0 auto;padding-block:18px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:18px}

.filtros{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:end}
.filtros label{display:grid;gap:4px;font-size:12px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.filtros select,.filtros input{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;text-transform:none;letter-spacing:0;font-weight:400;font-size:15px;color:var(--ink)}
.filtros .buscar{flex:1 1 220px}
.filtros .buscar input{width:100%}

.avance{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:10px}
.avance-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.avance-num{font-family:var(--f-display);font-size:30px;font-weight:700;line-height:1}
.avance-num small{font-size:16px;color:var(--ink-3);font-weight:600}
.pista{height:10px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.relleno{height:100%;background:var(--hecho);border-radius:999px;transition:width .3s ease}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;padding:3px 10px;border-radius:999px;background:var(--neutro-soft);color:var(--ink-2);font-variant-numeric:tabular-nums}

.grupo{display:grid;gap:8px}
.grupo-h{display:flex;align-items:baseline;gap:10px;margin:6px 0 0}
.grupo-h h2{font-family:var(--f-display);font-size:19px;font-weight:700;margin:0}
.grupo-h span{color:var(--ink-3);font-size:13px}
.etq{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:999px}
.etq.vence_hoy{background:var(--hoy-soft);color:var(--hoy)}
.etq.lc_aprobada,.etq.llamar{background:var(--urgente-soft);color:var(--urgente)}
.etq.agendado,.etq.postventa{background:var(--accent-soft);color:var(--accent)}
.etq.revisar{background:var(--neutro-soft);color:var(--ink-2)}

.encabezado,.fila{display:grid;grid-template-columns:150px minmax(0,1.1fr) minmax(0,1.3fr) minmax(0,1.5fr);gap:14px;align-items:start}
.encabezado{font-size:11px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.07em;padding:0 14px}
.fila{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.fila.hecha{background:var(--hecho-soft);border-color:transparent}
.fila.hecha .cliente-n,.fila.hecha .accion-t{text-decoration:line-through;text-decoration-color:var(--ink-3)}
.col{min-width:0}
.cliente-n{font-weight:700}
.meta{color:var(--ink-3);font-size:13px;font-variant-numeric:tabular-nums}
.meta .mono{font-family:var(--f-mono);font-size:12px}
.odoo{display:inline-block;margin-top:4px;font-size:13px;font-weight:600;text-decoration:none}
.odoo:hover{text-decoration:underline}
.paso{color:var(--ink-2);font-size:14px}
.accion-t{font-weight:600}
.lbl{display:none;font-size:11px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:2px}
details.guion{margin-top:6px}
details.guion summary{cursor:pointer;font-size:13px;color:var(--accent);font-weight:600}
.guion-t{margin:6px 0 0;padding:10px 12px;background:var(--surface-2);border-radius:8px;font-size:14px;color:var(--ink)}
.copiar{margin-top:6px;background:none;border:1px solid var(--line);border-radius:6px;padding:3px 10px;font-size:12px;cursor:pointer;color:var(--ink-2)}

.marcar{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;padding:9px 10px;border-radius:8px;border:1.5px solid var(--hecho);background:var(--surface);color:var(--hecho);font-weight:700;cursor:pointer}
.marcar:hover{background:var(--hecho-soft)}
.marcar .caja{width:16px;height:16px;border:2px solid currentColor;border-radius:4px;display:inline-grid;place-items:center;font-size:11px;line-height:1}
.fila.hecha .marcar{background:var(--hecho);color:var(--surface);border-color:var(--hecho)}
.marcar:disabled{opacity:.55;cursor:not-allowed}
.quien{margin-top:6px;font-size:12px;color:var(--ink-3)}
.resultado{margin-top:6px;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 8px;font-size:13px;resize:vertical;min-height:34px}

.vacio,.aviso{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:28px 20px;text-align:center;color:var(--ink-2)}
.vacio h2{font-family:var(--f-display);margin:0 0 6px;color:var(--ink)}
.vacio code{font-family:var(--f-mono);font-size:13px;background:var(--surface-2);padding:2px 6px;border-radius:4px}

.tabla-w{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);font-weight:700;background:var(--surface-2)}
td.n,th.n{text-align:right}
tr:last-child td{border-bottom:none}
.mini{display:inline-block;width:70px;height:6px;background:var(--surface-2);border-radius:999px;vertical-align:middle;margin-right:6px;overflow:hidden}
.mini i{display:block;height:100%;background:var(--hecho)}
.hallazgos{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.hallazgos h2{font-family:var(--f-display);margin:0 0 8px;font-size:19px}
.hallazgos ol{margin:0;padding-left:20px;display:grid;gap:6px;max-width:75ch}

@media (max-width:820px){
  .encabezado{display:none}
  .fila{grid-template-columns:1fr;gap:10px}
  .lbl{display:block}
  .col-estado{order:5}
}
@media (prefers-reduced-motion:reduce){.relleno{transition:none}}
</style>

<header class="barra">
  <div class="barra-in">
    <div class="marca">
      <h1>Coach Comercial Latinbien</h1>
      <p id="actualizado">Cargando…</p>
    </div>
    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" id="tab-acciones" data-vista="acciones" aria-selected="true">Acciones del día</button>
      <button class="tab" role="tab" id="tab-equipo" data-vista="equipo" aria-selected="false">Equipo</button>
    </nav>
  </div>
</header>

<main>
  <section id="vista-acciones" class="grupo" style="gap:18px">
    <div class="filtros">
      <label>Ejecutivo<select id="f-ejecutivo"><option value="">Todos</option></select></label>
      <label>Fecha<select id="f-fecha"></select></label>
      <label>Grupo<select id="f-grupo"><option value="">Todos</option><option value="vence_hoy">Vence hoy</option><option value="lc_aprobada">Línea aprobada: cerrar venta</option><option value="llamar">Llamar hoy</option><option value="postventa">Campaña postventa y recompra</option><option value="agendado">Ya tienen seguimiento</option><option value="revisar">Revisar</option></select></label>
      <label>Estado<select id="f-estado"><option value="">Todas</option><option value="pend">Pendientes</option><option value="hecha">Hechas</option></select></label>
      <label class="buscar">Buscar<input id="f-buscar" type="search" placeholder="Cliente, acción o número de lead"></label>
    </div>
    <div class="avance" id="avance" hidden>
      <div class="avance-top">
        <div class="avance-num" id="avance-num">0 <small>de 0 hechas</small></div>
        <div class="chips" id="avance-chips"></div>
      </div>
      <div class="pista"><div class="relleno" id="avance-barra" style="width:0%"></div></div>
    </div>
    <div id="lista"></div>
  </section>

  <section id="vista-equipo" class="grupo" style="gap:18px" hidden>
    <div id="equipo"></div>
  </section>
</main>

<script>
const GRUPOS = [
  {id:'vence_hoy',  titulo:'Vence hoy',                 nota:'Actividades que el ejecutivo ya agendó para hoy'},
  {id:'lc_aprobada',titulo:'Línea aprobada: cerrar venta',nota:'Clientes calificados; solo falta facturar'},
  {id:'llamar',     titulo:'Llamar hoy',                nota:'Sin nota del ejecutivo o con objeción abierta'},
  {id:'postventa',  titulo:'Postventa y recompra',      nota:'Facturados sin seguimiento; contado → invitar a línea de crédito'},
  {id:'agendado',   titulo:'Ya tienen seguimiento',     nota:'Con actividad futura en el CRM'},
  {id:'revisar',    titulo:'Revisar',                   nota:'Duplicados, reasignaciones o datos por corregir'},
];
const ODOO = id => 'https://latinbien.com/web#id=' + encodeURIComponent(id) + '&model=crm.lead&view_type=form';
const $ = s => document.querySelector(s);
const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
const fmtFecha = iso => { if (!iso) return ''; const [y,m,d] = iso.slice(0,10).split('-'); return d + '/' + m + '/' + y; };
const fmtHora = iso => { try { return new Date(iso).toLocaleString('es-VE',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}); } catch(e){ return ''; } };

const estado = { acciones: [], marcas: {}, equipo: null, meta: null, db: null, user: null, puedeMarcar: null, perfiles: {} };

// ---------- vistas (hash #acciones / #equipo) ----------
function mostrarVista(v){
  if (v !== 'equipo') v = 'acciones';
  $('#vista-acciones').hidden = v !== 'acciones';
  $('#vista-equipo').hidden = v !== 'equipo';
  document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', String(t.dataset.vista === v)));
}
document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => { location.hash = t.dataset.vista; mostrarVista(t.dataset.vista); }));
window.addEventListener('hashchange', () => mostrarVista(location.hash.slice(1)));
mostrarVista(location.hash.slice(1));

// ---------- filtros ----------
function llenarFiltros(){
  const ejs = [...new Set(estado.acciones.map(a => a.ejecutivo).filter(Boolean))].sort();
  const fechas = [...new Set(estado.acciones.map(a => a.fecha).filter(Boolean))].sort().reverse();
  const selE = $('#f-ejecutivo'), selF = $('#f-fecha');
  const vE = selE.value, vF = selF.value;
  selE.replaceChildren(new Option('Todos', ''), ...ejs.map(e => new Option(e, e)));
  selF.replaceChildren(...fechas.map(f => new Option(fmtFecha(f), f)), new Option('Todas', '*'));
  selE.value = ejs.includes(vE) ? vE : '';
  selF.value = (vF && (vF === '*' || fechas.includes(vF))) ? vF : (fechas[0] || '*');
}
['#f-ejecutivo','#f-fecha','#f-grupo','#f-estado'].forEach(s => $(s).addEventListener('change', render));
$('#f-buscar').addEventListener('input', render);

function filtradas(){
  const ej = $('#f-ejecutivo').value, fe = $('#f-fecha').value, es = $('#f-estado').value, gr = $('#f-grupo').value;
  const q = $('#f-buscar').value.trim().toLowerCase();
  return estado.acciones.filter(a => {
    if (ej && a.ejecutivo !== ej) return false;
    if (gr && a.grupo !== gr) return false;
    if (fe && fe !== '*' && a.fecha !== fe) return false;
    const hecha = !!(estado.marcas[a._id] && estado.marcas[a._id].hecho);
    if (es === 'pend' && hecha) return false;
    if (es === 'hecha' && !hecha) return false;
    if (q && ![a.cliente, a.accion, a.que_paso, a.oportunidad, String(a.lead_id), a.ejecutivo].join(' ').toLowerCase().includes(q)) return false;
    return true;
  });
}

// ---------- render de acciones ----------
async function render(){
  const meta = estado.meta;
  $('#actualizado').textContent = meta && meta.actualizado
    ? 'Copia del ' + fmtHora(meta.actualizado) + ' · las marcas "Hecho" se guardan solo en este navegador'
    : (estado.db ? 'Sin datos todavía' : 'Datos del CRM, solo lectura');

  const lista = $('#lista');
  if (!estado.db){
    lista.replaceChildren(aviso('Abre esta página en claude.ai, con tu sesión iniciada, para ver y marcar las acciones.'));
    $('#avance').hidden = true; return;
  }
  if (!estado.acciones.length){
    const v = el('div','vacio');
    v.append(el('h2',null,'Aún no hay acciones cargadas'));
    const p = el('p'); p.append('Las acciones llegan cuando se ejecuta el coach en Claude Code: ');
    p.append(el('code',null,'/coach-comercial <ejecutivo>')); p.append('. Cada cliente aparecerá aquí con su acción y un botón para marcarla como hecha.');
    v.append(p); lista.replaceChildren(v); $('#avance').hidden = true; return;
  }

  const rows = filtradas();
  // Avance del filtro actual
  const hechas = rows.filter(a => estado.marcas[a._id] && estado.marcas[a._id].hecho).length;
  $('#avance').hidden = false;
  $('#avance-num').replaceChildren(document.createTextNode(hechas + ' '), el('small', null, 'de ' + rows.length + ' hechas'));
  $('#avance-barra').style.width = (rows.length ? Math.round(hechas / rows.length * 100) : 0) + '%';
  $('#avance-chips').replaceChildren(...GRUPOS.map(g => {
    const n = rows.filter(a => a.grupo === g.id).length; if (!n) return null;
    const h = rows.filter(a => a.grupo === g.id && estado.marcas[a._id] && estado.marcas[a._id].hecho).length;
    return el('span','chip', g.titulo + ': ' + h + '/' + n);
  }).filter(Boolean));

  // Nombres de quien marco (solo ids en el store)
  const ids = [...new Set(rows.map(a => estado.marcas[a._id] && estado.marcas[a._id].por).filter(Boolean))];
  if (estado.user && ids.length){ try { estado.perfiles = await estado.user.profiles(ids); } catch(e){} }

  const frag = document.createDocumentFragment();
  if (!rows.length){ frag.append(aviso('Ninguna acción coincide con los filtros.')); }
  GRUPOS.forEach(g => {
    const delGrupo = rows.filter(a => a.grupo === g.id).sort((x,y) => (x.orden||0) - (y.orden||0));
    if (!delGrupo.length) return;
    const sec = el('section','grupo');
    const h = el('div','grupo-h'); h.append(el('span','etq ' + g.id, g.titulo), el('span', null, g.nota + ' · ' + delGrupo.length));
    sec.append(h);
    const enc = el('div','encabezado'); ['Estado','Cliente','Qué pasó','Acción'].forEach(t => enc.append(el('div',null,t)));
    sec.append(enc);
    delGrupo.forEach(a => sec.append(fila(a)));
    frag.append(sec);
  });
  lista.replaceChildren(frag);
}

function aviso(txt){ const d = el('div','aviso'); d.textContent = txt; return d; }

function fila(a){
  const m = estado.marcas[a._id] || {};
  const f = el('article','fila' + (m.hecho ? ' hecha' : ''));

  // Estado (boton)
  const cE = el('div','col col-estado');
  const b = el('button','marcar'); b.type = 'button'; b.id = 'marcar-' + a._id;
  const caja = el('span','caja', m.hecho ? '✓' : '');
  b.append(caja, document.createTextNode(m.hecho ? 'Hecho' : 'Marcar hecho'));
  b.setAttribute('aria-pressed', String(!!m.hecho));
  if (estado.puedeMarcar === false){ b.disabled = true; b.title = 'Tu acceso es de solo lectura'; }
  b.addEventListener('click', () => alternar(a, b));
  cE.append(b);
  if (m.hecho){
    const quien = estado.perfiles[m.por];
    cE.append(el('div','quien', (quien && quien.name ? quien.name : 'Marcado en este navegador') + ' · ' + fmtHora(m.en)));
    const t = el('textarea','resultado'); t.id = 'res-' + a._id; t.placeholder = 'Resultado (opcional)'; t.value = m.nota || '';
    if (estado.puedeMarcar === false) t.disabled = true;
    t.addEventListener('change', () => guardarNota(a, t.value));
    cE.append(t);
  }

  // Cliente
  const cC = el('div','col');
  cC.append(el('div','lbl','Cliente'), el('div','cliente-n', a.cliente || ('Lead ' + a.lead_id)));
  const meta = el('div','meta');
  meta.append(document.createTextNode([a.etapa, a.dias != null ? a.dias + ' d en la etapa' : null].filter(Boolean).join(' · ')));
  meta.append(el('br'));
  meta.append(document.createTextNode((a.ejecutivo || '') + ' · '), el('span','mono','#' + a.lead_id));
  cC.append(meta);
  if (a.oportunidad) cC.append(el('div','meta', a.oportunidad));
  const lk = el('a','odoo','Abrir en Odoo ↗'); lk.href = ODOO(a.lead_id); lk.target = '_blank'; lk.rel = 'noopener';
  cC.append(lk);

  // Que paso
  const cP = el('div','col');
  cP.append(el('div','lbl','Qué pasó'), el('div','paso', a.que_paso || 'Sin nota del ejecutivo.'));

  // Accion + guion
  const cA = el('div','col');
  cA.append(el('div','lbl','Acción'), el('div','accion-t', a.accion || ''));
  if (a.guion){
    const d = el('details','guion'); d.append(el('summary',null,'Ver guion'));
    const g = el('p','guion-t', a.guion); d.append(g);
    const c = el('button','copiar','Copiar guion'); c.type = 'button';
    c.addEventListener('click', async () => {
      try { await navigator.clipboard.writeText(a.guion); c.textContent = 'Copiado'; }
      catch(e){ const r = document.createRange(); r.selectNodeContents(g); const s = getSelection(); s.removeAllRanges(); s.addRange(r); c.textContent = 'Texto seleccionado: Ctrl+C'; }
      setTimeout(() => { c.textContent = 'Copiar guion'; }, 2500);
    });
    d.append(c); cA.append(d);
  }

}

// ---------- escrituras: una por accion del usuario ----------
async function alternar(a, boton){
  if (!estado.db) return;
  const actual = estado.marcas[a._id] || {};
  boton.disabled = true;
  try {
    const uid = estado.user ? await estado.user.id() : null;
    const cuerpo = actual.hecho
      ? { hecho: false, por: uid, en: new Date().toISOString(), nota: actual.nota || '' }
      : { hecho: true,  por: uid, en: new Date().toISOString(), nota: actual.nota || '' };
    await estado.db.doc('marcas/' + a._id).set(cuerpo);
  } catch(e){
    if (e && e.code === 'invalid_argument'){ estado.puedeMarcar = false; render(); }
    else { boton.textContent = 'No se guardó; intenta de nuevo'; }
  } finally { boton.disabled = estado.puedeMarcar === false; }
}
async function guardarNota(a, texto){
  const actual = estado.marcas[a._id]; if (!actual || !estado.db) return;
  if ((actual.nota || '') === texto) return;
  try { await estado.db.doc('marcas/' + a._id).update({ nota: texto.slice(0, 500) }); } catch(e){}
}

// ---------- equipo ----------
function renderEquipo(){
  const cont = $('#equipo');
  const eq = estado.equipo;
  const frag = document.createDocumentFragment();
  // Avance de acciones por ejecutivo (todas las fechas cargadas)
  const porEj = {};
  estado.acciones.forEach(a => {
    const k = a.ejecutivo || 'Sin ejecutivo';
    const o = porEj[k] || (porEj[k] = { total: 0, hechas: 0 });
    o.total++; if (estado.marcas[a._id] && estado.marcas[a._id].hecho) o.hechas++;
  });

  if (!eq && !Object.keys(porEj).length){
    const v = el('div','vacio'); v.append(el('h2',null,'Sin vista de equipo todavía'));
    const p = el('p'); p.append('Se carga al ejecutar '); p.append(el('code',null,'/coach-comercial equipo')); p.append(' en Claude Code.');
    v.append(p); cont.replaceChildren(v); return;
  }

  if (eq){
    const t = el('div','grupo-h'); t.append(el('h2',null,'Cartera por ejecutivo'), el('span',null,'Corte del ' + fmtFecha(eq.fecha) + ' · parado = más de 48 h en la misma etapa'));
    frag.append(t);
    const w = el('div','tabla-w'); const tb = el('table');
    const cab = ['Ejecutivo','Abiertos','Parados','Prioridad A','Depurar','Nuevos 7 d','Dónde se acumulan','Acciones hechas'];
    const thead = el('thead'); const tr = el('tr');
    cab.forEach((c,i) => tr.append(el('th', i>0 && i<6 ? 'n' : null, c))); thead.append(tr); tb.append(thead);
    const tbody = el('tbody');
    (eq.ejecutivos || []).forEach(e => {
      const r = el('tr');
      r.append(el('td',null,e.ejecutivo));
      [e.abiertos,e.parados,e.A,e.depurar,e.nuevos7d].forEach(v => r.append(el('td','n', v == null ? '-' : String(v))));
      r.append(el('td',null,e.acumulan || ''));
      const av = porEj[e.ejecutivo]; const td = el('td');
      if (av){ const mi = el('span','mini'); const i = el('i'); i.style.width = Math.round(av.hechas/av.total*100) + '%'; mi.append(i); td.append(mi, document.createTextNode(av.hechas + '/' + av.total)); }
      else td.textContent = '–';
      r.append(td); tbody.append(r);
    });
    tb.append(tbody); w.append(tb); frag.append(w);
    if (eq.hallazgos && eq.hallazgos.length){
      const h = el('div','hallazgos'); h.append(el('h2',null,'Hallazgos para actuar'));
      const ol = el('ol'); eq.hallazgos.forEach(x => ol.append(el('li',null,x))); h.append(ol); frag.append(h);
    }
  }
  cont.replaceChildren(frag);
}

const CLAVE = 'coach-marcas';
function leerMarcas(){ try { return JSON.parse(localStorage.getItem(CLAVE) || '{}'); } catch(e){ return {}; } }
function guardarMarcas(m){ try { localStorage.setItem(CLAVE, JSON.stringify(m)); } catch(e){} }
estado.db = { doc: p => {
  const id = p.split('/')[1];
  return {
    set: async cuerpo => { const m = leerMarcas(); m[id] = cuerpo; guardarMarcas(m); estado.marcas = m; render(); renderEquipo(); },
    update: async cambios => { const m = leerMarcas(); m[id] = { ...(m[id] || {}), ...cambios }; guardarMarcas(m); estado.marcas = m; },
  };
} };
estado.puedeMarcar = true;
